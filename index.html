<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Тренажёр итальянского языка по песне L’italiano">
  <title>L’italiano — тренажёр A1–A2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=27">
</head>
<body>
  <div class="app-shell">
    <div class="progress-track" aria-hidden="true"><span id="progress-bar"></span></div>

    <main>
      <section id="listen-view" class="view is-active" aria-label="Прослушивание и текст">
        <section class="song-reading">
          <div class="media-panel">
            <header class="song-header">
              <p>TOTO CUTUGNO</p>
              <h1>L’ITALIANO</h1>
              <button class="training-cta" type="button" data-go="training-view">ПЕРЕЙТИ К УПРАЖНЕНИЯМ →</button>
            </header>
            <div class="media-grid">
              <div class="listen-controls listen-controls--left">
                <button id="autoscroll-button" class="pill-button" type="button" aria-pressed="false">автопрокрутка</button>
                <h2 class="language-label language-label--it">ITALIANO</h2>
              </div>
              <aside class="player-pane">
                <div class="player-frame"><div id="youtube-player"></div></div>
                <a id="youtube-fallback" class="fallback-link" href="https://www.youtube.com/watch?v=TYtdYslLY9I" target="_blank" rel="noreferrer" hidden>Открыть видео на YouTube</a>
              </aside>
              <div class="listen-controls listen-controls--right">
                <button id="reveal-all-button" class="pill-button" type="button" aria-pressed="false">показать перевод</button>
                <h2 class="language-label language-label--ru">RUSSO</h2>
              </div>
            </div>
          </div>
          <div id="lyrics-root" class="lyrics-scroll"></div>
          <a class="story-cue" href="#song-history" aria-label="Перейти к истории песни">
            <span class="story-cue__word story-cue__word--left">SCOPRI</span>
            <svg class="story-cue__arrow" viewBox="0 0 100 150" aria-hidden="true">
              <defs>
                <linearGradient id="story-ribbon-gradient" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#70b8ff"></stop>
                  <stop offset=".55" stop-color="#a995eb"></stop>
                  <stop offset="1" stop-color="#e78dbb"></stop>
                </linearGradient>
              </defs>
              <path class="story-cue__ribbon" d="M38 4C65 33 32 64 53 95L66 111C69 115 68 119 63 121L53 125L58 143C59 148 53 151 49 147L24 122C20 118 21 113 26 111L38 106C23 74 59 43 38 4Z"></path>
            </svg>
            <span class="story-cue__word story-cue__word--right">LA STORIA</span>
          </a>
        </section>
        <section id="song-history" class="inline-history" aria-label="История песни">
          <div id="inline-history-root"></div>
        </section>
      </section>

      <section id="training-view" class="view" aria-label="Выбор упражнений">
        <div id="training-menu"></div>
      </section>
      <section id="exercise-view" class="view" aria-label="Упражнение">
        <div id="exercise-root"></div>
      </section>
      <section id="summary-view" class="view" aria-label="Результат">
        <div id="summary-root"></div>
      </section>
    </main>
  </div>
  <script type="module" src="js/app.js?v=27"></script>
</body>
</html>
